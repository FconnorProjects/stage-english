name: Deploy Built Stage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  issues: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '21.7.1'

      - name: Confirm CHUB_AUTH_TOKEN is set
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          if [ -z "$CHUB_AUTH_TOKEN" ]; then
            echo "CHUB_AUTH_TOKEN is not set for this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Get or create Chub Stage ID
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
          SECRET_STAGE_ID: ${{ secrets.STAGE_ID }}
        run: |
          set -e

          mkdir -p public
          touch public/chub_meta.yaml

          if ! grep -q '^github_path:' public/chub_meta.yaml; then
            echo "" >> public/chub_meta.yaml
            echo "github_path: 'https://github.com/${{ github.repository }}'" >> public/chub_meta.yaml
          fi

          if [ -n "$SECRET_STAGE_ID" ]; then
            STAGE_ID="$SECRET_STAGE_ID"
          else
            STAGE_ID=$(grep '^extension_id:' public/chub_meta.yaml | head -n 1 | cut -d ':' -f2- | tr -d " '\"" || true)
          fi

          if [ -z "$STAGE_ID" ]; then
            echo "No Stage ID found. Creating a new Chub Stage..."
            curl --fail-with-body \
              -H "CH-API-KEY: $CHUB_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              --request POST \
              --data '{"name":"${{ github.event.repository.name }}"}' \
              https://api.chub.ai/extensions \
              -o creation.json

            STAGE_ID=$(jq -r '.id_v2 // empty' creation.json)

            if [ -z "$STAGE_ID" ]; then
              echo "Chub did not return a Stage ID. Response:"
              cat creation.json
              exit 1
            fi

            echo "" >> public/chub_meta.yaml
            echo "extension_id: '$STAGE_ID'" >> public/chub_meta.yaml
          fi

          echo "STAGE_ID=$STAGE_ID" >> "$GITHUB_ENV"

          if ! git diff --quiet -- public/chub_meta.yaml; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add public/chub_meta.yaml
            git commit -m "Update Chub Stage metadata"
            git push
          fi

      - name: Install dependencies
        run: yarn install

      - name: Build Stage
        run: yarn build

      - name: Package Stage
        run: |
          cd dist
          zip -r ../build.zip .
          cd ..

      - name: Upload Stage to Chub
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          curl --fail-with-body \
            -H "CH-API-KEY: $CHUB_AUTH_TOKEN" \
            -F "file=@build.zip" \
            "https://api.chub.ai/extension/${STAGE_ID}/upload"
