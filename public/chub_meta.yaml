project_name: "English Enforcer"
tagline: "Forces Chub replies into English and translates foreign-script output."
visibility: "PRIVATE"
position: "NONE"

tags:
  - "Utility"
  - "Language"
  - "Translation"

config_schema:
  type: object
  properties:
    force_english:
      type: boolean
      default: true
      description: "Append a strong English-only instruction to every prompt."
    auto_translate:
      type: boolean
      default: true
      description: "Automatically translate replies containing non-Latin scripts into English."
    sensitivity:
      type: string
      enum:
        - strict
        - balanced
        - conservative
      default: balanced
      description: "How readily foreign-script text triggers a translation pass."

state_schema:
  message:
    type: object
    properties:
      translated:
        type: boolean
        default: false

is_anonymous: false
ratings_disabled: true
